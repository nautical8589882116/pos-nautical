# Publishes the site to GitHub Pages so the blog index is publicly reachable
# even while Azure Web App credentials are missing.
# After first success, enable Pages: Settings → Pages → Source = GitHub Actions
# Live URL: https://nautical8589882116.github.io/pos-nautical/blog/

name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
