# On every push to main that touches blog/**:
# 1. Rebuild blog/index.html + sitemap.xml from blog/posts.json
# 2. Commit regenerated files
# 3. Ping search engines with the sitemap (notification only — not GSC login)
# Azure SWA (if linked to this repo) deploys the push automatically.
name: Blog pipeline

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'sitemap.xml'
      - '.github/scripts/**'
      - '.github/workflows/blog-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate index and sitemap
        run: node .github/scripts/generate-blog.js

      - name: Commit if changed
        run: |
          git config user.name "nautical-blog-bot"
          git config user.email "bot@nautical.co.in"
          git add blog/index.html sitemap.xml
          if git diff --staged --quiet; then
            echo "No index/sitemap changes."
          else
            git commit -m "chore(blog): regenerate index and sitemap [skip ci]"
            git push
          fi

      - name: Notify search engines of sitemap
        run: |
          SITEMAP="https://www.nautical.co.in/sitemap.xml"
          curl -sS -o /dev/null -w "google:%{http_code}\n" \
            "https://www.google.com/ping?sitemap=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$SITEMAP'))")" || true
          curl -sS -o /dev/null -w "bing:%{http_code}\n" \
            "https://www.bing.com/ping?sitemap=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$SITEMAP'))")" || true
          echo "Sitemap notified. GSC Request indexing still needs one-time property + optional per-URL click (see /blog/ steps 1-4)."
