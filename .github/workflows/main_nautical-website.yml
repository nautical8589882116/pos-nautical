name: Deploy Nautical website to Azure Web App

# Deploys on every push to main that touches the site.
# REQUIRED secrets (repo Settings → Secrets and variables → Actions):
#   AZURE_WEBAPP_PUBLISH_PROFILE — download from Azure Portal →
#     App Service "nautical-website" → Get publish profile
# Optional alternative: AZURE_CREDENTIALS (service principal JSON) + azure/login

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**'
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'staticwebapp.config.json'
      - '.github/workflows/main_nautical-website.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nautical-website'
          slot-name: 'Production'
          package: '.'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
