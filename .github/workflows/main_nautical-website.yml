name: Deploy Nautical website to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**'
      - 'index.html'
      - 'staticwebapp.config.json'
      - '.github/workflows/main_nautical-website.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nautical-website'
          slot-name: 'Production'
          package: .